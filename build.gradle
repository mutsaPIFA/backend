plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.mutsapifa'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// @RequestParam/@PathVariable 이름을 리플렉션으로 읽기 위해 필요
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}

// spring-dotenv가 프로젝트 루트의 .env를 읽으려면 working directory가 루트여야 한다
tasks.named('bootRun') {
    workingDir = rootProject.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = rootProject.projectDir
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams false
    }
}

spotless {
    java {
        googleJavaFormat()
        formatAnnotations()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    // Web + Validation
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JPA + PostgreSQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway (마이그레이션) — ERD 확정 후 db/migration 에 V1__init.sql 추가
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // .env 로딩 (Gemini 키 등)
    implementation 'me.paulschwarz:spring-dotenv:3.0.0'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (access token + refresh token)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // AI 서비스(FastAPI) 호출용 — WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 룩 이미지 비동기 생성 재시도 등
    implementation 'org.springframework.retry:spring-retry'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger UI — 프론트가 /swagger-ui.html 로 직접 찔러볼 수 있게
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // Actuator (health check)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers (운영과 동일한 PostgreSQL 방언으로 테스트)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
