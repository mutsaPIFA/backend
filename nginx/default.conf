# MCM MUSE — 단일 origin 게이트웨이 (배포 결정 2026-08-14)
# 프론트 정적 파일 + 백엔드 프록시를 한 주소로: 쿠키(refresh)·CORS·mixed content 문제가 구조적으로 사라진다.

server {
    listen 80;

    # 스캔 업로드 15MB(계약 §3-1) + 여유
    client_max_body_size 20m;

    # AI 파이프라인 응답 대기 (코디 화보 20~40s 실측, 첫 콜 스로틀 ~80s)
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 데모·검증용 — 외부 오픈이 부담스러우면 배포 후 이 블록을 주석 처리
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # 프론트 SPA — 빌드 산출물(../frontend/dist)이 마운트된다
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
