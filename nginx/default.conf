# MCM MUSE — 단일 origin 게이트웨이 (배포 결정 2026-08-14)
# 프론트 정적 파일 + 백엔드 프록시를 한 주소로: 쿠키(refresh)·CORS·mixed content 문제가 구조적으로 사라진다.

server {
    listen 80;

    # Let's Encrypt HTTP-01 챌린지 — setup-https 워크플로가 이 웹루트로 인증서를 발급한다
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 스캔 업로드 15MB(계약 §3-1) + 여유
    client_max_body_size 20m;

    # AI 파이프라인 응답 대기 (코디 화보 20~40s 실측, 첫 콜 스로틀 ~80s)
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /images/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 데모·검증용 — 외부 오픈이 부담스러우면 배포 후 이 블록을 주석 처리
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # 프론트 SPA — 빌드 산출물(../frontend/dist)이 마운트된다
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# 인증서 발급 후 setup-https 워크플로가 생성하는 443 server 블록.
# 와일드카드 include라 파일이 없으면(=로컬, 인증서 발급 전) 조용히 무시된다 — nginx 기동 실패 없음.
include /etc/letsencrypt/nginx-*.conf;
