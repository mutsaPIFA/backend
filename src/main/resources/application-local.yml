spring:
  datasource:
    # 컨테이너 postgres는 호스트 5433으로 노출된다 (로컬 PostgreSQL 설치와의 포트 충돌 회피).
    url: jdbc:postgresql://localhost:5433/mcmmuse
    username: ${DB_USERNAME:mcmmuse}
    password: ${DB_PASSWORD:mcmmuse}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    com.mutsapifa.mcmmuse: DEBUG
    org.hibernate.SQL: DEBUG
