spring:
  application:
    name: mcm-muse
  profiles:
    active: local

  jpa:
    hibernate:
      # 스키마는 Flyway가 소유한다. ERD 확정 후 db/migration/V1__init.sql 작성.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # POST /scan 업로드 (스마트폰 원본 사진 여유분)
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Swagger UI — 수동 검증 편의 설정
springdoc:
  swagger-ui:
    try-it-out-enabled: true         # Try it out 기본 활성화 (클릭 한 번 절약)
    persist-authorization: true      # 새로고침해도 Authorize 토큰 유지
    display-request-duration: true
    default-models-expand-depth: -1  # 하단 Schemas 섹션 접기

# ---------------------------------------------------------------------------
# 애플리케이션 설정
# ---------------------------------------------------------------------------
app:
  # 인증 — access token(body) + refresh token(HttpOnly 쿠키)
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-must-be-at-least-32-bytes-long}
    # 시연 기간 한정 24h — APK 웹뷰는 크로스오리진 http라 refresh 쿠키가 저장되지 않아
    # 30m이면 앱 로그인이 계속 풀린다. 행사 후 30m 복귀 예정 (2026-08-20)
    access-token-ttl: ${APP_JWT_ACCESS_TTL:24h}
    refresh-token-ttl: 14d
    cookie-secure: false   # HTTPS 배포 시 true (8/18 가비아 배포 때)

  # CORS — refresh 쿠키를 쓰므로 allowCredentials=true 이고, 와일드카드 오리진 불가
  # 게스트 발급(§1-6) — 시드 옷장의 원본 계정. 기본 비움 = 빈 옷장 시작 (부스 실물 스캔 체험, 팀 확정 2026-08-20).
  demo:
    guest-template-email: ${APP_DEMO_GUEST_TEMPLATE_EMAIL:}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      # Capacitor APK 웹뷰 오리진 (androidScheme http/https)
      - http://localhost
      - https://localhost
      # 배포 도메인 — nginx가 443을 백엔드에 http로 프록시해 스킴이 불일치하면
      # same-origin 요청도 CORS로 판정된다 → 두 스킴 모두 명시 허용
      - http://mcmmuse.duckdns.org
      - https://mcmmuse.duckdns.org

  # 이미지 저장 — StorageService 추상화 (계약 Q8)
  storage:
    type: local            # local | s3
    local-path: ./uploads
    public-base-url: http://localhost:8080/images

  # AI 서비스 연동 — 포트별 스위치(mock | http). 준비된 것부터 실물 전환.
  # cutout·tagging·standardize: http 기본 — ai 서비스(:8000)가 떠 있어야 한다. ai가 죽으면 스캔은 409(재스캔 유도).
  # standardize는 billing 키 필요(무료 티어는 이미지 생성 할당 0) — 키가 무료면 스캔은 원본 폴백으로 동작.
  # 통합 테스트는 각 테스트 클래스에서 mock으로 고정한다 — ai 서비스·Gemini 가용성에 비종속.
  ai:
    base-url: http://localhost:8000
    timeout: 90s           # Gemini 첫 콜 스로틀(~79s 실측) + 표준화 이미지 생성(~18s 실측) 대비
    cutout: http
    tagging: http
    standardize: http
    outfit-image: http     # 코디 후보 화보 — mock이면 imageUrl=null(프론트 콜라주 폴백)
    outfit-compose: http   # 코디 조합 LLM — 실패 시 런타임에 룰베이스 폴백(AiClientConfig)
    recommend: http        # DNA·MCM추천 LLM — 실패 시 런타임에 룰베이스 폴백
