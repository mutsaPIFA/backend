spring:
  application:
    name: mcm-muse
  profiles:
    active: local

  jpa:
    hibernate:
      # 스키마는 Flyway가 소유한다. ERD 확정 후 db/migration/V1__init.sql 작성.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # POST /scan 업로드 (스마트폰 원본 사진 여유분)
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info

# ---------------------------------------------------------------------------
# 애플리케이션 설정
# ---------------------------------------------------------------------------
app:
  # 인증 — access token(body) + refresh token(HttpOnly 쿠키)
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-must-be-at-least-32-bytes-long}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    cookie-secure: false   # HTTPS 배포 시 true (8/18 가비아 배포 때)

  # CORS — refresh 쿠키를 쓰므로 allowCredentials=true 이고, 와일드카드 오리진 불가
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  # 이미지 저장 — StorageService 추상화 (계약 Q8)
  storage:
    type: local            # local | s3
    local-path: ./uploads
    public-base-url: http://localhost:8080/images

  # AI 서비스 연동 — 포트별 스위치(mock | http). 준비된 것부터 실물 전환.
  # cutout: ai 서비스(rembg)만 띄우면 http 가능 (키 불필요)
  # tagging / standardize: Gemini billing 키 확보 후 http
  ai:
    base-url: http://localhost:8000
    timeout: 90s           # Gemini 무료 티어 첫 콜 스로틀 ~79s 실측 — 여유 있게
    cutout: mock
    tagging: mock
    standardize: mock
